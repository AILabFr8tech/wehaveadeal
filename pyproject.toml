[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wehaveadeal"
version = "0.1.0"
description = "Research toolkit for bilateral freight negotiation: plug your own shipper/carrier agent into the We Have a Deal arena and benchmark it against nine reference architectures."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.5",
    "numpy>=2.0",  # the bundled RL2Fixed weights were serialized under numpy 2
    "scipy>=1.11",
    # The learned baselines (ML/ML2 via scikit-learn, RL/RL2 via stable-baselines3)
    # are part of the benchmark roster, so their runtimes are core dependencies.
    # The paper's numbers were verified with scikit-learn 1.5.2 (exact versions for
    # reproducing the paper: paper/requirements-verified.txt).
    # Upper bound: scikit-learn 1.9 can no longer unpickle the bundled ML/ML2 models.
    "scikit-learn>=1.5,<1.9",
    "joblib>=1.3",
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
]

[project.urls]
Homepage = "https://github.com/AILabFr8tech/wehaveadeal"
Repository = "https://github.com/AILabFr8tech/wehaveadeal"
Issues = "https://github.com/AILabFr8tech/wehaveadeal/issues"

[project.optional-dependencies]
# Live dashboard backend (`wehaveadeal serve`)
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# Reference LLM agents (CarrierLLM / ShipperLLM) talk to YOUR Ollama server
llm = ["requests>=2.31"]
# Re-running the paper's notebooks and scripts (paper/)
paper = ["pandas>=2.2", "matplotlib>=3.9", "seaborn>=0.13", "statsmodels>=0.14", "jupyter>=1.0", "nbconvert>=7.16", "nbformat>=5.10", "requests>=2.31"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.115", "requests>=2.31"]

[project.scripts]
wehaveadeal = "wehaveadeal.cli:main"

[tool.setuptools.packages.find]
include = ["wehaveadeal*"]

[tool.setuptools.package-data]
wehaveadeal = ["baselines_data/ml/*", "baselines_data/rl/*", "toolkit/templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-protocol runs (deselect with -m 'not slow')",
]
